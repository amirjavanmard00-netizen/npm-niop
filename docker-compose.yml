version: '3.8'

services:
  # ==============================================================================
  # 1. پایگاه داده رابطه‌ای PostgreSQL
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: niopdc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niopdc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureNiopdcPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-niopdc_media}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niopdc_user} -d ${POSTGRES_DB:-niopdc_media}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. اپلیکیشن مانیتورینگ رسانه (Express API + Vite React + Scheduler)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niopdc_media_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-niopdc_user}:${POSTGRES_PASSWORD:-SecureNiopdcPass2026!}@postgres:5432/${POSTGRES_DB:-niopdc_media}?schema=public
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_ANALYSIS_ENABLED: ${AI_ANALYSIS_ENABLED:-true}
      NEWS_POLL_INTERVAL_MINUTES: ${NEWS_POLL_INTERVAL_MINUTES:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==============================================================================
  # 3. وب‌سرور معکوس Nginx برای Production
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: niopdc_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx

volumes:
  postgres_data:
    driver: local
