# ==============================================================================
# Nginx Configuration for NIOPDC Media Monitoring System
# پیکربندی سرور Nginx برای استقرار نسخه عملیاتی
# ==============================================================================

upstream nodejs_upstream {
    server app:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # تغییر مسیر به HTTPS در صورت فعال‌سازی SSL (در محیط عملیاتی فعال شود)
    # return 301 https://$host$request_uri;

    # فشرده‌سازی Gzip برای افزایش چشمگیر سرعت لود
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # حداکثر حجم مجاز درخواست (جهت دریافت متن‌های طولانی و بسته‌ها)
    client_max_body_size 20M;

    # هدرهای امنیتی (Security Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # پایش سلامت سرویس (Health Check)
    location /api/health {
        proxy_pass http://nodejs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # مسیردهی تمام درخواست‌های API به وب‌سرور Express
    location /api/ {
        proxy_pass http://nodejs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # تایم‌اوت طولانی‌تر جهت پردازش هوش مصنوعی
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # مسیردهی رابط کاربری (Frontend & Static Assets)
    location / {
        proxy_pass http://nodejs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # کش‌گذاری فایل‌های استاتیک در مرورگر کاربر
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://nodejs_upstream;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
