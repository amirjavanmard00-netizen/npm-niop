name: NIOPDC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/supabase-auth]

permissions:
  contents: read

concurrency:
  group: niopdc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
      DATABASE_URL: file:./prisma/ci.db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
