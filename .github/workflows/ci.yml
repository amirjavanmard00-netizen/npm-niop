name: NIOPDC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, security/supabase-auth]

permissions:
  contents: read

concurrency:
  group: niopdc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      ALLOW_SQLITE_PRODUCTION: 'true'
      DATABASE_URL: file:./prisma/ci.db
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      CORS_ORIGIN: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconcile npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Validate PostgreSQL schema
        run: |
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres npx prisma validate --schema prisma/schema.postgresql.prisma
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/postgres npx prisma generate --schema prisma/schema.postgresql.prisma
      - name: Verify demo content is not seeded
        run: |
          if grep -Eq 'top10NewsData|isSeed: true|DATABASE_SEEDED' server/seed.ts; then
            echo 'Synthetic news content must not be inserted into the live database.'
            exit 1
          fi
      - name: Type check
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Upload reconciled lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: niopdc-package-lock
          path: package-lock.json
          if-no-files-found: error
